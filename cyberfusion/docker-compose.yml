services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cyberfusion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: cyberfusion
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberfusion"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://cyberfusion:${POSTGRES_PASSWORD}@db:5432/cyberfusion
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      DEMO_DATA: ${DEMO_DATA:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-CyberFusion-Demo-2026}
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports: ["8080:80"]   # put a TLS-terminating proxy in front of this for anything beyond local testing
    depends_on: [backend]
    restart: unless-stopped

volumes:
  pgdata:
